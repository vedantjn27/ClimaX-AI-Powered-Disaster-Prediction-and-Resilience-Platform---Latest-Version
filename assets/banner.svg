<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="60%" style="stop-color:#0d1f3c"/>
      <stop offset="100%" style="stop-color:#1a2f50"/>
    </linearGradient>
    <linearGradient id="earthglow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#1a4a8a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="stormgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0d2b4a;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="wavegrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.3"/>
    </linearGradient>
    <radialGradient id="sungrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#f97316;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="alertglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="180" fill="url(#sky)" rx="14"/>

  <!-- Stars -->
  <g>
    <circle cx="30" cy="15" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="25" r="0.8" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="12" r="1.1" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="20" r="0.9" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="10" r="1" fill="white" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="18" r="0.8" fill="white" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="8" r="1.2" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="22" r="0.9" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="14" r="1" fill="white" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Earth globe (left) -->
  <g>
    <circle cx="90" cy="110" r="58" fill="#0d2b4a" opacity="0.9"/>
    <circle cx="90" cy="110" r="58" fill="none" stroke="#2563eb" stroke-width="1.5" opacity="0.5"/>
    <!-- Continents (simplified) -->
    <ellipse cx="78" cy="95" rx="18" ry="22" fill="#16a34a" opacity="0.7"/>
    <ellipse cx="105" cy="115" rx="14" ry="18" fill="#15803d" opacity="0.6"/>
    <ellipse cx="68" cy="125" rx="10" ry="12" fill="#166534" opacity="0.5"/>
    <!-- Ocean shimmer -->
    <circle cx="90" cy="110" r="57" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Alert pulse on globe -->
    <circle cx="90" cy="110" r="62" fill="url(#alertglow)" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Globe overlay atmosphere -->
    <circle cx="90" cy="110" r="62" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.2">
      <animate attributeName="r" values="62;68;62" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Storm cloud (center) -->
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,-6" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95" values="0,0;0,-6;0,0"/>
    <ellipse cx="450" cy="72" rx="90" ry="35" fill="#1e3a5f" opacity="0.9"/>
    <ellipse cx="400" cy="80" rx="60" ry="28" fill="#1e3a5f" opacity="0.85"/>
    <ellipse cx="500" cy="78" rx="65" ry="30" fill="#1e3a5f" opacity="0.85"/>
    <ellipse cx="450" cy="88" rx="80" ry="32" fill="#1e2a4a"/>
    <!-- Lightning bolt -->
    <polyline points="450,90 442,112 452,112 444,135" stroke="#fbbf24" stroke-width="2.5" fill="none" filter="url(#softglow)">
      <animate attributeName="opacity" values="0;0;1;0;0;1;0" dur="3s" repeatCount="indefinite"/>
    </polyline>
    <!-- Rain drops -->
    <line x1="415" y1="120" x2="411" y2="135" stroke="#60a5fa" stroke-width="1.5" opacity="0.7">
      <animate attributeName="y1" values="110;125" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="125;140" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="115" x2="426" y2="130" stroke="#60a5fa" stroke-width="1.5" opacity="0.7">
      <animate attributeName="y1" values="108;123" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="123;138" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="468" y1="118" x2="464" y2="133" stroke="#60a5fa" stroke-width="1.5" opacity="0.7">
      <animate attributeName="y1" values="112;127" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="127;142" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="485" y1="120" x2="481" y2="135" stroke="#60a5fa" stroke-width="1.5" opacity="0.6">
      <animate attributeName="y1" values="115;130" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="130;145" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- AI satellite / signal (right) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,-4" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95" values="0,0;0,-4;0,0"/>
    <!-- Satellite body -->
    <rect x="790" y="30" width="30" height="18" fill="#94a3b8" rx="3"/>
    <!-- Solar panels -->
    <rect x="764" y="35" width="24" height="8" fill="#2563eb" rx="2" opacity="0.9"/>
    <rect x="822" y="35" width="24" height="8" fill="#2563eb" rx="2" opacity="0.9"/>
    <!-- Dish -->
    <ellipse cx="805" cy="30" rx="8" ry="5" fill="#cbd5e1"/>
    <line x1="805" y1="30" x2="805" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Signal waves -->
    <path d="M805,50 Q830,65 820,80" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M805,50 Q840,72 826,92" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M805,50 Q850,80 832,104" stroke="#38bdf8" stroke-width="0.7" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flood water wave at bottom -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-300,0" to="0,0" dur="5s" repeatCount="indefinite"/>
    <path d="M-300,148 C-240,138 -180,158 -120,148 C-60,138 0,158 60,148 C120,138 180,158 240,148 C300,138 360,158 420,148 C480,138 540,158 600,148 C660,138 720,158 780,148 C840,138 900,158 960,148 C1020,138 1080,158 1140,148 C1200,138 1260,158 1320,148 L1320,180 L-300,180 Z" fill="url(#wavegrad)" opacity="0.8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-300,0" dur="4s" repeatCount="indefinite"/>
    <path d="M0,156 C60,146 120,166 180,156 C240,146 300,166 360,156 C420,146 480,166 540,156 C600,146 660,166 720,156 C780,146 840,166 900,156 C960,146 1020,166 1080,156 C1140,146 1200,166 1260,156 L1260,180 L0,180 Z" fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- Alert beacon pulse -->
  <g>
    <circle cx="450" cy="152" r="6" fill="#ef4444" filter="url(#softglow)">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="152" r="14" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="10;20;10" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
